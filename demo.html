<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monofy Compare</title>
    <style>
      body {
        padding: 40px;
        background: #f7f4ef;
        color: #1f1a17;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 32px;
        max-width: 900px;
      }
      .label {
        margin: 0 0 10px;
        font:
          600 14px/1.2 Arial,
          Helvetica,
          sans-serif;
        color: #6b5f57;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .timer-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .timer {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
      }
      .emoji {
        font-size: 56px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <div>
        <p class="label">Normal</p>
        <div class="timer-row">
          <h1 id="plain" class="timer"></h1>
          <span class="emoji">🔥</span>
        </div>
      </div>
      <div>
        <p class="label">Monofy</p>
        <div class="timer-row">
          <h1 id="monofy" class="timer"></h1>
          <span class="emoji">🔥</span>
        </div>
      </div>
    </div>
    <script type="module">
      import Monofy from "./dist/index.js";
      const plain = document.getElementById("plain");
      const monofy = document.getElementById("monofy");
      const values = ["11:11", "88:88"];
      let index = 0;
      function render() {
        const value = values[index % values.length];
        plain.textContent = value;
        monofy.innerHTML = Monofy(value, {
          font: '700 72px Georgia, "Times New Roman", serif',
        });
        index += 1;
      }
      render();
      setInterval(render, 1000);
    </script>
  </body>
</html>
